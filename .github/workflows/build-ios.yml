name: Build iOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Xcode toolchain
        run: xcodebuild -version

      - name: Build unsigned iOS release for validation
        run: >-
          xcodebuild -project ios/Ampere.xcodeproj -scheme Ampere
          -sdk iphoneos -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Upload unsigned iOS app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ampere-ios-${{ github.ref_name }}
          path: build/DerivedData/Build/Products/Release-iphoneos/Ampere.app
