name: Build iOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show Xcode toolchain
        run: xcodebuild -version

      - name: Build unsigned iOS release for validation
        run: >-
          xcodebuild -project ios/Ampere.xcodeproj -scheme Ampere
          -sdk iphoneos -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Upload unsigned iOS app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ampere-ios-${{ github.ref_name }}
          path: build/DerivedData/Build/Products/Release-iphoneos/Ampere.app
