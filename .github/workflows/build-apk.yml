name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android 16/17 SDK platforms
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "platforms;android-37.0" "build-tools;37.0.0"
          test -e "$ANDROID_HOME/platforms/android-37" || ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Run direct flavor unit tests and lint
        run: gradle -p android :app:testDirectDebugUnitTest :app:lintDirectDebug

      - name: Restore private signing keys
        env:
          KEYSTORE_BASE64: ${{ secrets.AMPERE_ROTATED_KEYSTORE_BASE64 }}
          OLD_KEYSTORE_BASE64: ${{ secrets.AMPERE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$OLD_KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/ci-release.keystore
          echo "$OLD_KEYSTORE_BASE64" | base64 --decode > android/ci-old-release.keystore

      - name: Build direct-distribution release APK
        env:
          AMPERE_KEYSTORE_FILE: ${{ github.workspace }}/android/ci-release.keystore
          AMPERE_KEYSTORE_PASSWORD: ${{ secrets.AMPERE_ROTATED_KEYSTORE_PASSWORD }}
          AMPERE_KEY_ALIAS: ${{ secrets.AMPERE_ROTATED_KEY_ALIAS }}
          AMPERE_KEY_PASSWORD: ${{ secrets.AMPERE_ROTATED_KEY_PASSWORD }}
        run: gradle -p android :app:assembleDirectRelease -x lintVitalAnalyzeDirectRelease

      - name: Build Google Play App Bundle
        env:
          AMPERE_KEYSTORE_FILE: ${{ github.workspace }}/android/ci-release.keystore
          AMPERE_KEYSTORE_PASSWORD: ${{ secrets.AMPERE_ROTATED_KEYSTORE_PASSWORD }}
          AMPERE_KEY_ALIAS: ${{ secrets.AMPERE_ROTATED_KEY_ALIAS }}
          AMPERE_KEY_PASSWORD: ${{ secrets.AMPERE_ROTATED_KEY_PASSWORD }}
        run: gradle -p android :app:bundlePlayRelease -x lintVitalAnalyzePlayRelease

      - name: Apply signing certificate rotation
        env:
          OLD_KEYSTORE_PASSWORD: android
          OLD_KEY_ALIAS: androiddebugkey
          OLD_KEY_PASSWORD: android
          NEW_KEYSTORE_PASSWORD: ${{ secrets.AMPERE_ROTATED_KEYSTORE_PASSWORD }}
          NEW_KEY_ALIAS: ${{ secrets.AMPERE_ROTATED_KEY_ALIAS }}
          NEW_KEY_PASSWORD: ${{ secrets.AMPERE_ROTATED_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -f 4 android/app/build/outputs/apk/direct/release/app-direct-release.apk android/app/build/outputs/apk/direct/release/app-direct-release-aligned.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks android/ci-old-release.keystore \
            --ks-pass env:OLD_KEYSTORE_PASSWORD \
            --ks-key-alias "$OLD_KEY_ALIAS" \
            --key-pass env:OLD_KEY_PASSWORD \
            --next-signer \
            --ks android/ci-release.keystore \
            --ks-pass env:NEW_KEYSTORE_PASSWORD \
            --ks-key-alias "$NEW_KEY_ALIAS" \
            --key-pass env:NEW_KEY_PASSWORD \
            --lineage android/ampere-release.lineage \
            --rotation-min-sdk-version 28 \
            --in android/app/build/outputs/apk/direct/release/app-direct-release-aligned.apk \
            --out android/app/build/outputs/apk/direct/release/app-direct-release-rotated.apk
          mv android/app/build/outputs/apk/direct/release/app-direct-release-rotated.apk android/app/build/outputs/apk/direct/release/app-direct-release.apk

      - name: Verify release signing identity
        run: |
          expected="301bed44b5cc342485b485b24baeea404dbdb216e6e3e134ad2ebd6b28d1dce3"
          actual=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/direct/release/app-direct-release.apk | awk -F': ' '/SHA-256 digest/ { print $NF; exit }')
          test "$actual" = "$expected"
          ! "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/direct/release/app-direct-release.apk | grep -q 'CN=Android Debug'
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --min-sdk-version 23 android/app/build/outputs/apk/direct/release/app-direct-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --min-sdk-version 34 android/app/build/outputs/apk/direct/release/app-direct-release.apk

      - name: Keep the stable direct APK release filename
        run: cp android/app/build/outputs/apk/direct/release/app-direct-release.apk android/app/build/outputs/apk/direct/release/app-release.apk

      - name: Generate release checksums
        run: sha256sum android/app/build/outputs/apk/direct/release/app-release.apk android/app/build/outputs/bundle/playRelease/app-play-release.aab > android/app/build/outputs/release-SHA256SUMS.txt

      - name: Attest direct APK provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: android/app/build/outputs/apk/direct/release/app-release.apk

      - name: Attest Play bundle provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: android/app/build/outputs/bundle/playRelease/app-play-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ampere-battery-lab-${{ github.ref_name }}
          path: |
            android/app/build/outputs/apk/direct/release/app-release.apk
            android/app/build/outputs/bundle/playRelease/app-play-release.aab
            android/app/build/outputs/release-SHA256SUMS.txt

      - name: Attach APK to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            android/app/build/outputs/apk/direct/release/app-release.apk
            android/app/build/outputs/bundle/playRelease/app-play-release.aab
            android/app/build/outputs/release-SHA256SUMS.txt
