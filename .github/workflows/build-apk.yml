name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android 16/17 SDK platforms
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "platforms;android-37.0" "build-tools;37.0.0"
          test -e "$ANDROID_HOME/platforms/android-37" || ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Restore update-compatible signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AMPERE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/ci-release.keystore

      - name: Build release APK
        env:
          AMPERE_KEYSTORE_FILE: ${{ github.workspace }}/android/ci-release.keystore
          AMPERE_KEYSTORE_PASSWORD: android
          AMPERE_KEY_ALIAS: androiddebugkey
          AMPERE_KEY_PASSWORD: android
        run: gradle -p android :app:assembleRelease -x lintVitalAnalyzeRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ampere-battery-lab-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
