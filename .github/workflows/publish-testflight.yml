name: Publish iOS build to App Store Connect

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version to archive (for example 0.342)"
        required: true
        default: "0.342"
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare signing certificate and profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.AMPERE_IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.AMPERE_IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.AMPERE_IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.AMPERE_IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64"
          test -n "$PROFILE_BASE64"
          test -n "$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build-signing.keychain-db
          security set-keychain-settings -lut 21600 build-signing.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build-signing.keychain-db
          security default-keychain -s build-signing.keychain-db
          security list-keychains -d user -s build-signing.keychain-db
          echo "$CERTIFICATE_BASE64" | base64 --decode > build-distribution.p12
          security import build-distribution.p12 -k build-signing.keychain-db \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > build-profile.mobileprovision
          profile_uuid="$(security cms -D -i build-profile.mobileprovision | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin)"
          cp build-profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

      - name: Archive signed iOS release
        env:
          TEAM_ID: ${{ secrets.AMPERE_IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.AMPERE_IOS_PROVISIONING_PROFILE_NAME }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "$TEAM_ID"
          test -n "$PROFILE_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ios/Ampere/Info.plist)" = "$RELEASE_VERSION"
          xcodebuild -project ios/Ampere.xcodeproj -scheme Ampere \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Ampere.xcarchive archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export signed IPA
        env:
          TEAM_ID: ${{ secrets.AMPERE_IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>com.ampere.batterylab</key><string>${{ secrets.AMPERE_IOS_PROVISIONING_PROFILE_NAME }}</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Ampere.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export

      - name: Upload signed IPA to App Store Connect
        uses: Apple-Actions/upload-testflight-build@9fd28d4e690396e43caca69cef54cccccce77034 # v3
        with:
          app-path: build/export/Ampere.ipa
          app-type: ios
          issuer-id: ${{ secrets.AMPERE_ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.AMPERE_ASC_KEY_ID }}
          api-private-key: ${{ secrets.AMPERE_ASC_API_PRIVATE_KEY }}

      - name: Remove temporary signing material
        if: ${{ always() }}
        run: |
          security delete-keychain build-signing.keychain-db 2>/dev/null || true
          rm -f build-distribution.p12 build-profile.mobileprovision
