name: Publish Google Play bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to upload (for example 0.382)"
        required: true
        default: "0.382"
        type: string
      track:
        description: "Play testing/release track"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - production
      status:
        description: "Release status in the selected track"
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed
      validate_only:
        description: "Validate bundle and Play credential without uploading"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify public Play bundle
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build
          curl --fail --silent --show-error --location \
            "https://github.com/Apfelkringel/ampere-battery-lab/releases/download/v${RELEASE_VERSION}/app-play-release.aab" \
            --output build/Ampere-Battery-Lab-play-release.aab
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/Apfelkringel/ampere-battery-lab-updates/main/latest.json" \
            --output build/latest.json
          test "$(jq -r .versionName build/latest.json)" = "$RELEASE_VERSION"
          expected="$(jq -r .aabSha256 build/latest.json)"
          actual="$(sha256sum build/Ampere-Battery-Lab-play-release.aab | awk '{print $1}')"
          test "$expected" = "$actual"

      - name: Validate Play publisher credential
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.AMPERE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error title=Missing Play API credential::Add AMPERE_PLAY_SERVICE_ACCOUNT_JSON as a repository Actions secret."
            exit 1
          fi
          if ! printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | jq --exit-status \
            --arg expected_email 'ampere-play-publisher@ampere-battery-lab-analytics.iam.gserviceaccount.com' \
            '.type == "service_account" and .client_email == $expected_email and (.private_key | type == "string" and length > 0)' \
            >/dev/null; then
            echo "::error title=Invalid Play API credential::The secret must contain the ampere-play-publisher service-account JSON."
            exit 1
          fi

          # Prove that Google's OAuth service accepts this key and that the
          # account can reach this app through a read-only Play API endpoint.
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          now="$(date +%s)"
          client_email="$(printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | jq -er '.client_email')"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | jq -er '.private_key' > "$tmp_dir/private-key.pem"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          payload="$(jq -cn \
            --arg iss "$client_email" \
            --arg scope 'https://www.googleapis.com/auth/androidpublisher' \
            --arg aud 'https://oauth2.googleapis.com/token' \
            --argjson iat "$now" \
            --argjson exp "$((now + 3600))" \
            '{iss:$iss,scope:$scope,aud:$aud,iat:$iat,exp:$exp}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          unsigned_token="$header.$payload"
          signature="$(printf '%s' "$unsigned_token" | openssl dgst -sha256 -sign "$tmp_dir/private-key.pem" | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          assertion="$unsigned_token.$signature"
          curl --fail --silent --show-error \
            --output "$tmp_dir/oauth-token.json" \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data "grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=$assertion" \
            'https://oauth2.googleapis.com/token'
          access_token="$(jq -er '.access_token' "$tmp_dir/oauth-token.json")"
          curl --fail --silent --show-error --output /dev/null \
            --header "Authorization: Bearer $access_token" \
            'https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.ampere.batterylab/reviews?maxResults=1'
          echo 'Google OAuth and read-only Play API access validated.'

      - name: Upload bundle to Google Play
        if: ${{ !inputs.validate_only }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.AMPERE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ampere.batterylab
          releaseFiles: build/Ampere-Battery-Lab-play-release.aab
          tracks: ${{ inputs.track }}
          status: ${{ inputs.status }}
