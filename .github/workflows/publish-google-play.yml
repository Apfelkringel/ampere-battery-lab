name: Publish Google Play bundle

on:
  workflow_dispatch:
    inputs:
      console_preflight_confirmed:
        description: "Confirm the authenticated Console was just checked: no pending/in-review changes, active Alpha/fallback verified, and Play minSdk continuity checked."
        required: true
        default: false
        type: boolean
      validate_only:
        description: "Validate bundle and Play credential without uploading"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-google-play
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TRACK: alpha
      RELEASE_STATUS: completed
      CONSOLE_PREFLIGHT_CONFIRMED: ${{ inputs.console_preflight_confirmed }}
      ALPHA_COMPATIBILITY_FALLBACK_CODE: "459"
    steps:
      - name: Check out the default-branch release source
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Verify the Play device-compatibility baseline
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "::error title=Default branch required::Dispatch this workflow from main so the compatibility guard checks the release source."
            exit 1
          fi
          play_min_sdk="$(awk '
            /^[[:space:]]*play[[:space:]]*\{/ { in_play=1; next }
            in_play && /^[[:space:]]*minSdk[[:space:]]+[0-9]+([[:space:]]|$)/ {
              value=$2
              print value
              exit
            }
            in_play && /^[[:space:]]*}/ { in_play=0 }
          ' android/app/build.gradle)"
          if [[ "$play_min_sdk" != '24' ]]; then
            echo "::error title=Play compatibility review required::Expected Play minSdk 24 for fallback code 459, found '${play_min_sdk:-unrecognized}'. Reassess the retained version-code coverage before uploading."
            exit 1
          fi
          echo 'Play flavor minSdk 24 matches the verified Alpha compatibility baseline.'

      - name: Download and verify public Play bundle
        run: |
          set -euo pipefail
          mkdir -p build
          curl --fail --silent --show-error --location \
            --header 'Accept: application/vnd.github.raw+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/Apfelkringel/ampere-battery-lab-updates/contents/Ampere-Battery-Lab-play-release.aab?ref=main" \
            --output build/Ampere-Battery-Lab-play-release.aab
          curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github.raw+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/Apfelkringel/ampere-battery-lab-updates/contents/latest.json?ref=main" \
            --output build/latest.json
          release_version="$(jq -er .versionName build/latest.json)"
          release_code="$(jq -er .versionCode build/latest.json)"
          [[ "$release_version" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          [[ "$release_code" =~ ^[0-9]+$ ]]
          (( release_code > 0 ))
          expected="$(jq -r .aabSha256 build/latest.json)"
          actual="$(sha256sum build/Ampere-Battery-Lab-play-release.aab | awk '{print $1}')"
          test "$expected" = "$actual"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$release_code" >> "$GITHUB_ENV"
          echo "Verified public Play bundle version $release_version (code $release_code)."

      - name: Validate Play publisher credential
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.AMPERE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ "$CONSOLE_PREFLIGHT_CONFIRMED" != 'true' ]]; then
            echo "::error title=Play Console preflight required::Recheck the authenticated Console immediately before dispatch. Stop if any change is pending/in review, the Alpha track differs, or unrelated Store changes are queued."
            exit 1
          fi
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error title=Missing Play API credential::Add AMPERE_PLAY_SERVICE_ACCOUNT_JSON as a repository Actions secret."
            exit 1
          fi
          if ! printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | jq --exit-status \
            --arg expected_email 'ampere-play-publisher@ampere-battery-lab-analytics.iam.gserviceaccount.com' \
            '.type == "service_account" and .client_email == $expected_email and (.private_key | type == "string" and length > 0)' \
            >/dev/null; then
            echo "::error title=Invalid Play API credential::The secret must contain the ampere-play-publisher service-account JSON."
            exit 1
          fi

          # Prove that Google's OAuth service accepts this key and that the
          # account can reach this app through a read-only Play API endpoint.
          tmp_dir="$(mktemp -d)"
          edit_id=''
          cleanup_play_edit() {
            if [[ -n "$edit_id" && -n "${access_token:-}" ]]; then
              curl --fail --silent --show-error --request DELETE \
                --header "Authorization: Bearer $access_token" \
                "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.ampere.batterylab/edits/$edit_id" \
                >/dev/null || true
            fi
            rm -rf "$tmp_dir"
          }
          trap cleanup_play_edit EXIT
          now="$(date +%s)"
          client_email="$(printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | jq -er '.client_email')"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | jq -er '.private_key' > "$tmp_dir/private-key.pem"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          payload="$(jq -cn \
            --arg iss "$client_email" \
            --arg scope 'https://www.googleapis.com/auth/androidpublisher' \
            --arg aud 'https://oauth2.googleapis.com/token' \
            --argjson iat "$now" \
            --argjson exp "$((now + 3600))" \
            '{iss:$iss,scope:$scope,aud:$aud,iat:$iat,exp:$exp}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          unsigned_token="$header.$payload"
          signature="$(printf '%s' "$unsigned_token" | openssl dgst -sha256 -sign "$tmp_dir/private-key.pem" | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          assertion="$unsigned_token.$signature"
          curl --fail --silent --show-error \
            --output "$tmp_dir/oauth-token.json" \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data "grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=$assertion" \
            'https://oauth2.googleapis.com/token'
          access_token="$(jq -er '.access_token' "$tmp_dir/oauth-token.json")"
          curl --fail --silent --show-error --output /dev/null \
            --header "Authorization: Bearer $access_token" \
            'https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.ampere.batterylab/reviews?maxResults=1'
          echo 'Google OAuth and read-only Play API access validated.'

          desired_code="$RELEASE_VERSION_CODE"
          edit_json="$tmp_dir/edit.json"
          curl --fail --silent --show-error \
            --request POST \
            --output "$edit_json" \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Length: 0' \
            'https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.ampere.batterylab/edits'
          edit_id="$(jq -er .id "$edit_json")"
          track_json="$tmp_dir/track.json"
          curl --fail --silent --show-error \
            --output "$track_json" \
            --header "Authorization: Bearer $access_token" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.ampere.batterylab/edits/$edit_id/tracks/$RELEASE_TRACK"
          echo "Play API Alpha snapshot: $(jq -c '[.releases[]? | {status, versionCodes}]' "$track_json")"
          if jq -e --arg code "$desired_code" \
            'any(.releases[]?.versionCodes[]?; tostring == $code)' "$track_json" >/dev/null; then
            echo "Version code $desired_code is already on the $RELEASE_TRACK track; skipping upload."
            echo 'skip_upload=true' >> "$GITHUB_ENV"
          else
            if jq -e '.releases[]? | select(.status != "completed" and .status != "inProgress")' "$track_json" >/dev/null; then
              echo "::error title=Alpha track needs review::The Alpha track contains a draft or halted release. Do not replace it automatically; inspect continuity in Play Console first."
              exit 1
            fi
            if ! jq -e --arg code "$ALPHA_COMPATIBILITY_FALLBACK_CODE" \
              'any(.releases[]?.versionCodes[]?; tostring == $code)' "$track_json" >/dev/null; then
              echo "::error title=Known Alpha fallback missing::Expected API-23 compatibility fallback code $ALPHA_COMPATIBILITY_FALLBACK_CODE is not active on Alpha. Recheck device compatibility before changing the fallback."
              exit 1
            fi
            max_existing_code="$(jq -r '[.releases[]?.versionCodes[]? | tonumber] | max // 0' "$track_json")"
            if (( desired_code <= max_existing_code )); then
              echo "::error title=Non-monotonic Play version::New code $desired_code must be greater than active Alpha code $max_existing_code."
              exit 1
            fi
            echo "VERSION_CODES_TO_RETAIN=$ALPHA_COMPATIBILITY_FALLBACK_CODE" >> "$GITHUB_ENV"
            echo "Preserving API-23 compatibility fallback code $ALPHA_COMPATIBILITY_FALLBACK_CODE alongside new code $desired_code."
            echo 'skip_upload=false' >> "$GITHUB_ENV"
          fi
      - name: Wait for upload certificate activation
        run: |
          set -euo pipefail
          cert_url='https://raw.githubusercontent.com/Apfelkringel/ampere-battery-lab/main/android/ampere-upload-certificate.pem'
          curl --fail --silent --show-error --location "$cert_url" --output build/ampere-upload-certificate.pem
          not_before="$(openssl x509 -in build/ampere-upload-certificate.pem -noout -startdate | cut -d= -f2-)"
          start_epoch="$(date -u -d "$not_before" +%s)"
          now_epoch="$(date -u +%s)"
          # The certificate's own notBefore predates Google's Play Console
          # activation window after a reset. Honor the Console notification
          # too, otherwise the uploader still receives "recently reset".
          play_effective_at='2026-09-24T15:37:00Z'
          play_effective_epoch="$(date -u -d "$play_effective_at" +%s)"
          if (( now_epoch < start_epoch || now_epoch < play_effective_epoch )); then
            echo "Play upload key is not usable yet (certificate starts $not_before UTC; Console activation $play_effective_at); skipping upload."
            echo 'skip_upload=true' >> "$GITHUB_ENV"
          else
            echo "Play upload key is active (certificate started $not_before UTC; Console activation $play_effective_at)."
          fi

      - name: Upload bundle to Google Play
        if: ${{ !inputs.validate_only && env.skip_upload != 'true' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.AMPERE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ampere.batterylab
          releaseFiles: build/Ampere-Battery-Lab-play-release.aab
          tracks: ${{ env.RELEASE_TRACK }}
          status: ${{ env.RELEASE_STATUS }}
          versionCodesToRetain: ${{ env.VERSION_CODES_TO_RETAIN }}
