name: Validate Play metadata

on:
  push:
    paths:
      - "store/google-play/listing/**"
      - "tooling/validate-google-play-metadata.sh"
      - ".github/workflows/validate-play-metadata.yml"
  pull_request:
    paths:
      - "store/google-play/listing/**"
      - "tooling/validate-google-play-metadata.sh"
      - ".github/workflows/validate-play-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Google Play store metadata
        run: bash tooling/validate-google-play-metadata.sh
