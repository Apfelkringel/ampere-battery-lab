plugins {
    id "com.android.application"
}

android {
    namespace "com.ampere.batterylab"
    compileSdk 37
    def ciKeystorePath = System.getenv("AMPERE_KEYSTORE_FILE")

    defaultConfig {
        applicationId "com.ampere.batterylab"
        // Android 14+ is the supported device range; minSdk 23 keeps the
        // APK installable on older Android versions as a bonus.
        minSdk 23
        targetSdk 37
        versionCode 434
        versionName "0.434"
    }

    // The GitHub APK channel may offer an explicitly user-confirmed update.
    // The Play build must use Google Play's update mechanism and therefore
    // does not request package-install permission or run the APK updater.
    flavorDimensions "distribution"
    productFlavors {
        direct {
            dimension "distribution"
            buildConfigField "boolean", "DIRECT_DISTRIBUTION", "true"
        }
        play {
            dimension "distribution"
            buildConfigField "boolean", "DIRECT_DISTRIBUTION", "false"
        }
    }

    buildFeatures {
        buildConfig true
    }

    dependencies {
        implementation platform("com.google.firebase:firebase-bom:34.19.0")
        implementation "com.google.firebase:firebase-analytics"
        testImplementation "junit:junit:4.13.2"
    }

    signingConfigs {
        release {
            if (ciKeystorePath != null && file(ciKeystorePath).exists()) {
                storeFile file(ciKeystorePath)
                storePassword System.getenv("AMPERE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("AMPERE_KEY_ALIAS")
                keyPassword System.getenv("AMPERE_KEY_PASSWORD")
            }
        }
    }

    // Debug builds remain convenient; every task graph containing a release
    // task must provide the explicit keystore and can never fall back to debug.
    gradle.taskGraph.whenReady { taskGraph ->
        boolean releaseTask = taskGraph.allTasks.any { it.name.toLowerCase().contains("release") }
        if (releaseTask && (ciKeystorePath == null || !file(ciKeystorePath).exists()
                || System.getenv("AMPERE_KEYSTORE_PASSWORD") == null
                || System.getenv("AMPERE_KEY_ALIAS") == null
                || System.getenv("AMPERE_KEY_PASSWORD") == null)) {
            throw new GradleException("Release builds require the private AMPERE signing credentials; refusing fallback signing.")
        }
    }

    // Public distribution repository contains binaries only; source stays private.
    buildTypes.each { type ->
        type.buildConfigField "String", "UPDATE_MANIFEST_URL", '"https://raw.githubusercontent.com/Apfelkringel/ampere-battery-lab-updates/main/latest.json"'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

}

// Keep builds without a Firebase config usable. The app's checked-in
// google-services.json is public project configuration, not a secret.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}
